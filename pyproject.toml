[project]
name = "akshay-receipt-parser"
version = "0.1.0"
description = "Local invoice review and Excel export workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.3",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "pdfplumber==0.11.10",
  "pypdfium2==5.14.0",
  "openpyxl==3.1.5",
  "rapidocr==3.10.0",
  "onnxruntime==1.31.0",
  "httpx==0.28.1",
  "pillow==13.0.0",
  "python-dotenv==1.2.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
